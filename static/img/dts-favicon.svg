<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- App-icon variant of the mark.
       The primary logo is a tall, thin helix on white — at 16px the strokes
       disappear entirely. A filled brand tile with the helix reversed out
       survives the small sizes, which is what a favicon has to do. -->
  <rect width="400" height="400" rx="92" fill="#0B4F4C"/>
  <g transform="translate(200,200) scale(0.94) translate(-100,-200)">
    <path d="M100,100 A100,100 0 0 0 100,300 Z" fill="#1A8A7F" opacity="0.55"/>
    <g stroke="#7FD4B8" stroke-width="7" stroke-linecap="round" opacity="0.9">
      <line x1="87.16" y1="222" x2="112.84" y2="222"/>
      <line x1="76.11" y1="237" x2="123.89" y2="237"/>
      <line x1="67.63" y1="252" x2="132.37" y2="252"/>
      <line x1="62.46" y1="267" x2="137.54" y2="267"/>
      <line x1="61.03" y1="282" x2="138.97" y2="282"/>
      <line x1="63.48" y1="297" x2="136.52" y2="297"/>
      <line x1="69.59" y1="312" x2="130.41" y2="312"/>
      <line x1="78.84" y1="327" x2="121.16" y2="327"/>
      <line x1="90.42" y1="342" x2="109.58" y2="342"/>
    </g>
    <path d="M112,4 C124,14 122,28 100,40 C40,90 40,150 100,200 C160,250 160,310 100,360 C84,372 82,386 90,398"
          fill="none" stroke="#7FD4B8" stroke-width="15" stroke-linecap="round"/>
    <path d="M100,40 C160,90 160,150 100,200 C40,250 40,310 100,360"
          fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
    <path d="M64,74 Q100,120 136,74 Q108,128 100,198 Q92,128 64,74 Z" fill="#FFFFFF"/>
    <circle cx="100" cy="92" r="13" fill="#FFFFFF"/>
  </g>
</svg>
